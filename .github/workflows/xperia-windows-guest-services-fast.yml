name: Xperia Windows guest JNI/Bionic fast CI
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - 'experimental/xperia_guest_loader/**'
      - '.github/workflows/xperia-windows-guest-services-fast.yml'
  workflow_dispatch:
concurrency:
  group: xperia-guest-services-fast-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  msvc-guest-services:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure ARM32 JNI Bionic and ELF guest services (no JIT downloads)
        shell: pwsh
        run: cmake -S experimental/xperia_guest_loader -B build/guest-services -A x64
      - name: Build guest service and JNI tests with MSVC
        shell: pwsh
        run: cmake --build build/guest-services --config Release --parallel 4
      - name: Execute original-free ARM32 ABI regression suite
        shell: pwsh
        run: ctest --test-dir build/guest-services -C Release --output-on-failure
