name: Dead Space Milestone6 one-click WSL source update
on:
  push:
    branches:
      - work/deadspace-milestone6-analysis-2026-11-04
    paths:
      - experimental/lifted_milestone6/**
      - .github/workflows/dspc-m6-oneclick-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate original Linux crash symbolizer without needing WSL
        shell: pwsh
        run: |
          $p='experimental/lifted_milestone6/Diagnose-WSL-Crash.ps1'
          $tokens=$null
          $errs=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $p).Path,[ref]$tokens,[ref]$errs) | Out-Null
          if ($errs.Count) { throw ("PowerShell parse errors: "+($errs | Out-String)) }
          $log=Join-Path $env:RUNNER_TEMP 'wsl-game-20261104-184532.log'
          @'
          loaded /mnt/c/Users/Test/Downloads/dspc_milestone5_one_click_WSL_FIXED/dspc/apk/lib/armeabi/libDeadSpace.so at 0xe56c0000 (5000 KB)
          208/208 initializers completed
          JNI_OnLoad returned 0x10004
          window 1280x720; GL_RENDERER=llvmpipe (LLVM 19.1.7, 256 bits)
             [java] AssetManager.open(/mnt/c/Users/Test/Downloads/dspc/apk/assets/data.zip) -> FileNotFoundException
             [java] call com/eamobile/Query.getTotalMemory ()J (self=0x10188)
          !! signal 11 at pc=0x8627456, fault address (nil)
          backtrace (use nm -n dspc_native to map): 0x878f493 0xf7f38590 0x8627456
          guest image base 0xe56c0000
          '@ | Set-Content -Path $log -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p -LogPath $log -ParseOnly -Quiet
          if ($LASTEXITCODE -ne 0) { throw 'Crash parser test failed' }
          $report=[IO.Path]::ChangeExtension($log,'.symbolized.txt')
          $s=Get-Content -Raw $report
          foreach($needle in @('0x8627456','Captured backtrace frames: 3','Signal: 11','dspc_milestone5_one_click_WSL_FIXED','ParseOnly','data.zip')) {
            if (!$s.Contains($needle)) { throw "Missing parser output: $needle" }
          }
          Write-Host 'PASS Milestone5 Linux SIGSEGV address and game-path extraction'
      - name: Validate source-preserving TexturePack Linux crash diagnostic
        shell: pwsh
        run: |
          $file = 'experimental/lifted_milestone6/Diagnose-TexturePack-Linux.ps1'
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ("TexturePack PowerShell parse failed: " + ($errors | Out-String)) }
          Write-Host 'PASS original Linux native TexturePack diagnostic PowerShell syntax'
      - name: Test original ARM TexturePack guard and Linux relink shell
        shell: bash
        run: |
          set -euo pipefail
          bash -n experimental/lifted_milestone6/Apply-TexturePack-Linux.sh
          python3 -m py_compile experimental/lifted_milestone6/tools/texturepack_fault_guard.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('experimental/lifted_milestone6/tools/texturepack_fault_guard.py')
          spec = importlib.util.spec_from_file_location('guard', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          s = '''#include "protos.h"
          u64 f_0035b2e0(u32 r0, u32 r1, u32 r2, u32 r3, u32 sp) { /* TexturePack::load */
          L_35b564:;
            {
              u32 ea = r10 + 0u;
              r3 = LD32(ea);
            }
            {
              u32 ea = r3 + 0u;
              r1 = LD32(ea);
            }
          }
          u64 f_0035c844(u32 r0, u32 r1, u32 r2, u32 r3, u32 sp) {
            { u64 rv = f_00365a2c(r0, r1, r2, r3, sp); r0 = (u32)rv; r1 = (u32)(rv>>32); }
          }
          u64 f_0035c850(u32 r0, u32 r1, u32 r2, u32 r3, u32 sp) { return 0; }
          '''
          s = '\n'.join(line[10:] if line.startswith('          ') else line for line in s.splitlines())
          patched = mod.patch(s)
          assert 'FATAL:TEXPACK_NULL_VECTOR' in patched
          assert 'TEXPACK_SOURCE_VECTOR' in patched
          assert patched == mod.patch(patched)
          try:
              mod.patch(s.replace('L_35b564:;', 'L_35b560:;'))
          except ValueError:
              pass
          else:
              raise AssertionError('Accepted wrong ARM crash site')
          print('PASS TexturePack guard: source validation, idempotence, fail closed')
          PY
      - name: Test one-click install preserves mock APK and stale generated code
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP "dspc_mock"
          New-Item -ItemType Directory -Force (Join-Path $p "tools\out") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $p "apk\lib\armeabi") | Out-Null
          Set-Content (Join-Path $p "tools\gen_all.py") "old translation source"
          Set-Content (Join-Path $p "tools\host.c") "old host source"
          Set-Content (Join-Path $p "tools\out\protos.h") "old generated C"
          Set-Content (Join-Path $p "apk\lib\armeabi\libDeadSpace.so") "user owned asset sentinel"
          $installer = Join-Path $PWD "experimental\lifted_milestone6\Install-Milestone6.ps1"
          & pwsh -NoProfile -File $installer -ProjectDir $p -Quiet
          if ($LASTEXITCODE -ne 0) { throw "Installer exited $LASTEXITCODE" }
          $new = Get-Content -Raw (Join-Path $p "tools\host.c")
          if ($new -notmatch "RESOURCE_ROOTS") { throw "Updated host not installed" }
          $asset = Get-Content -Raw (Join-Path $p "apk\lib\armeabi\libDeadSpace.so")
          if ($asset -notmatch "user owned asset sentinel") { throw "Original ELF was modified" }
          if (Test-Path (Join-Path $p "tools\out")) { throw "Stale generated C cache still active" }
          $backup = @(Get-ChildItem -Directory (Join-Path $p "backups"))[0].FullName
          if (-not (Test-Path (Join-Path $backup "tools\host.c"))) { throw "Old host not backed up" }
          if (-not (Test-Path (Join-Path $backup "out\protos.h"))) { throw "Generated C not backed up" }
          if (-not (Test-Path (Join-Path $p "tools\texturepack_fault_guard.py"))) { throw "No texture guard installed" }
          Write-Host "PASS: offline one-click installer preserves APK, saves, old source and generated C"
  package-update:
    needs: validate-windows-installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage asset-free one-click update
        run: |
          mkdir -p update/tools
          cp experimental/lifted_milestone6/tools/* update/tools/
          cp experimental/lifted_milestone6/Install-Milestone6.ps1 update/
          cp experimental/lifted_milestone6/Install-Milestone6.cmd update/
          cp experimental/lifted_milestone6/README-ONECLICK.txt update/
          cp experimental/lifted_milestone6/Diagnose-TexturePack-Linux.ps1 update/
          cp 'experimental/lifted_milestone6/Diagnose TexturePack Linux.cmd' update/
          cp experimental/lifted_milestone6/Apply-TexturePack-Linux.sh update/
          cp experimental/lifted_milestone6/Diagnose-WSL-Crash.ps1 update/
          cp 'experimental/lifted_milestone6/Diagnose WSL Crash.cmd' update/
          echo "No original game ELF, APK, save data or extracted assets are included."
          find update -type f -printf '%P\n' | sort
      - name: Upload tested Windows one-click WSL source update
        uses: actions/upload-artifact@v4
        with:
          name: DeadSpace-Mobile-Milestone6-OneClick-Update
          path: update/
          if-no-files-found: error
          retention-days: 30
