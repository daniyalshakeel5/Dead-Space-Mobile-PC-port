name: Xperia actual-game PC boot adapter test
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - "tools/xperia_qemu_boot.py"
      - "tests/test_xperia_qemu_boot.py"
      - ".github/workflows/xperia-qemu-boot-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_xperia_qemu_boot.py -v
