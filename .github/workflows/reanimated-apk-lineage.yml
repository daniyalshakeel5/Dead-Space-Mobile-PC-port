name: Reanimated APK lineage comparison (metadata only)
on:
  push:
    branches:
      - work/deadspace-remote-preflight-2026-11-01
    paths:
      - "tools/deadspace_apk_lineage_compare.py"
      - "tests/test_deadspace_apk_lineage_compare.py"
      - ".github/workflows/reanimated-apk-lineage.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic ZIP lineage regression tests
        run: python -m unittest discover -s tests -p test_deadspace_apk_lineage_compare.py -v
      - name: Compare publicly released original and Reanimated APK metadata
        shell: bash
        env:
          ORIGINAL_URL: https://github.com/RAFALAMAO/Dead-Space-Mobile-Fixes/releases/download/dead_space_mobile_fixes/Deas.Space.Mobile.Fixes.apk
          REANIMATED_URL: https://github.com/GINESTR0/DeadSpaceReanimated/releases/download/v1.3/DeadSpaceReanimated-1.3.apk
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/original.apk" "$RUNNER_TEMP/reanimated.apk"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 \
            --max-time 1000 --max-filesize 900000000 -o "$RUNNER_TEMP/original.apk" "$ORIGINAL_URL"
          test "$(wc -c < "$RUNNER_TEMP/original.apk" | tr -d ' ')" = "325769461"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 \
            --max-time 1000 --max-filesize 900000000 -o "$RUNNER_TEMP/reanimated.apk" "$REANIMATED_URL"
          test "$(wc -c < "$RUNNER_TEMP/reanimated.apk" | tr -d ' ')" = "715366829"
          echo "dbd94ee54fc3fefdddb101fac4eba1e2058a5db7cfcf30ac41ad96e88b285a3a  $RUNNER_TEMP/reanimated.apk" | sha256sum -c -
          python -m tools.deadspace_apk_lineage_compare \
            --original "$RUNNER_TEMP/original.apk" \
            --reference "$RUNNER_TEMP/reanimated.apk" \
            --output "$RUNNER_TEMP/lineage-metadata.json"
          cp "$RUNNER_TEMP/lineage-metadata.json" lineage-metadata.json
          rm -f "$RUNNER_TEMP/original.apk" "$RUNNER_TEMP/reanimated.apk"
      - name: Upload only ZIP metadata, no original game files
        uses: actions/upload-artifact@v4
        with:
          name: deadspace-reanimated-metadata-lineage
          path: lineage-metadata.json
          if-no-files-found: error
          retention-days: 7
