name: "Dead Space: real APK model loader source context"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deadspace-real-model-loader-context.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deadspace-milestone6-analysis-2026-11-04
      - name: Download original game release (no synthetic input)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/real"
          gh release download apk-files-for-testing -R daniyalshakeel5/Dead-Space-Mobile-PC-port \
            --pattern 'Deas.Space.Mobile.Fixes.apk' --dir "$RUNNER_TEMP/real"
          cd "$RUNNER_TEMP/real"
          unzip -qq Deas.Space.Mobile.Fixes.apk 'lib/armeabi/libDeadSpace.so' 'assets/published/models/slasher.m3g' 'assets/published/models/lurker_projectile.m3g'
          echo "Original ARM library SHA256: $(sha256sum lib/armeabi/libDeadSpace.so)"
          echo "Original model size: $(stat -c %s assets/published/models/slasher.m3g)"
          echo "Original projectile model size: $(stat -c %s assets/published/models/lurker_projectile.m3g)"
          echo "Original projectile model first 64 bytes:"
          head -c 64 assets/published/models/lurker_projectile.m3g | od -An -tx1
          python3 - <<'PY'
          import struct,collections
          p="assets/published/models/lurker_projectile.m3g"
          d=open(p,"rb").read()
          print("[REAL_M3G_OBJECT_TABLE] filename",p,"length",len(d))
          if d[:12] != bytes.fromhex("ab 49 4d 2d 4d 33 47 bb 0d 0a 1a 0a"):
              print("[REAL_M3G_OBJECT_TABLE] Unexpected original signature")
          pos=12
          for section in range(8):
              if pos+13>len(d): break
              scheme=d[pos];length,raw=struct.unpack_from("<II",d,pos+1)
              if length<13 or pos+length>len(d):
                  print("[REAL_M3G_OBJECT_TABLE] Invalid section at",pos,length);break
              end=pos+length-4
              print("[REAL_M3G_OBJECT_TABLE] section",section,"compression",scheme,
                    "section bytes",length,"uncompressed bytes",raw)
              cur=pos+9; hist=collections.Counter(); examples=[]
              if scheme==0:
                  while cur+5<=end:
                      typ=d[cur];size=struct.unpack_from("<I",d,cur+1)[0]
                      if size>end-cur-5:
                          print("[REAL_M3G_OBJECT_TABLE] Invalid object length at",cur,typ,size);break
                      hist[typ]+=1
                      if len(examples)<16:examples.append((cur,typ,size))
                      cur+=5+size
                  print("[REAL_M3G_OBJECT_TABLE] types",sorted(hist.items()),"first",examples,
                        "consumed",cur-pos-9,"/",end-pos-9)
              pos+=length
              if pos==len(d):break
          PY
          echo "Original model first 64 bytes:"
          head -c 64 assets/published/models/slasher.m3g | od -An -tx1
      - name: Translate REAL ARM model loader and print target data flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --disable-pip-version-check pyelftools
          work="$GITHUB_WORKSPACE/experimental/lifted_milestone6/tools"
          cd "$work"
          DS_SO="$RUNNER_TEMP/real/lib/armeabi/libDeadSpace.so" DS_TEXTUREPACK_DIAG=0 python3 gen_all.py "$RUNNER_TEMP/generated"
          python3 - "$RUNNER_TEMP/generated" <<'PY'
          import pathlib,sys,re
          d=pathlib.Path(sys.argv[1])
          for func in ("f_0032a4c4",):
              print("\n========= ACTUAL GENERATED SOURCE",func,"=========",flush=True)
              matches=[]
              for p in d.glob("fn_*.c"):
                  s=p.read_text().splitlines()
                  for i,line in enumerate(s):
                      if line.startswith("u64 "+func+"("):
                          matches.append((p,s,i))
              print("Found",len(matches),"copies",flush=True)
              for p,s,i in matches:
                  end=next((j for j in range(i+1,len(s)) if s[j].startswith("u64 f_")),len(s))
                  print("FILE",p.name,"FUNCTION LINES",i+1,end,flush=True)
                  if func=="f_000629b4":
                      # Full function, enough to prove stack slot data provenance.
                      lo=i;hi=min(end,i+1200)
                      for j in range(lo,hi):print(f"{j+1:6d}: {s[j]}")
                  else:
                      for j in range(i,min(i+1500,end)):print(f"{j+1:6d}: {s[j]}")
          # Identify exact original ARM-to-C JNI/native input reader subroutines
          # rather than replacing valid model assets or guessing a byte stream.
          print("\n========= REAL APK INPUT STREAM BRIDGE FUNCTIONS =========")
          for p in d.glob("fn_*.c"):
              src=p.read_text().splitlines()
              for i,line in enumerate(src):
                  if line.startswith("u64 f_") and "/*" in line:
                      desc=line.split("/*",1)[1].lower()
                      if ("inputstream" in desc and ("read" in desc or "android" in desc)) or ("fileinputstream" in desc and "read" in desc):
                          end=next((j for j in range(i+1,len(src)) if src[j].startswith("u64 f_")),len(src))
                          print("STREAM_BRIDGE",p.name,i+1,src[i],flush=True)
                          for j in range(i,min(end,i+350)):
                              print(f"{j+1:6d}: {src[j]}",flush=True)
          # M3G native parser's exact object 100 branch and failure paths.
          print("\n========== ORIGINAL REAL M3G OBJECT DECODER BRANCHES ==========")
          for path in d.glob("fn_*.c"):
              rows=path.read_text().splitlines()
              if not any(row.startswith("u64 f_0032a4c4(") for row in rows):continue
              start=next(i for i,row in enumerate(rows) if row.startswith("u64 f_0032a4c4("))
              end=next((i for i in range(start+1,len(rows)) if rows[i].startswith("u64 f_")),len(rows))
              for label in ("L_32a75c:;","L_32a8c4:;","L_32aa6c:;","L_32ad04:;","L_32ad34:;","L_32ad64:;","L_32ad80:;","L_32ad98:;"):
                  hits=[i for i in range(start,end) if rows[i].strip()==label]
                  for i in hits:
                      print("BRANCH",label,"FILE",path.name,"LINE",i+1)
                      for j in range(max(start,i-6),min(end,i+74)):
                          print(f"{j+1:6d}: {rows[j]}")
          # Enumerate all genuine translated callers of Object3D::duplicate.
          # These are original ARM-to-C call sites, not simulated behavior.
          print("\n========= ORIGINAL Object3D::duplicate DIRECT CALLERS =========")
          count=0
          for p in d.glob("fn_*.c"):
              lines=p.read_text().splitlines()
              current="<none>"
              for i,line in enumerate(lines):
                  if line.startswith("u64 f_"):
                      current=line[:line.index("{")].strip()
                  if "f_00368efc(" in line and not line.startswith("u64 f_00368efc("):
                      count+=1
                      print(f"CALLER {p.name}:{i+1} {current}",flush=True)
                      for j in range(max(0,i-20),min(len(lines),i+14)):
                          print(f"{j+1:6d}: {lines[j]}")
          print(f"Original direct duplicate call sites: {count}",flush=True)
          # Also show raw local neighborhood around the exact runtime SIGSEGV.
          p=d/"fn_003.c"
          if p.exists():
              s=p.read_text().splitlines()
              print("\n========= REAL MODEL CRASH LOCAL SOURCE =========")
              for i in range(17380,min(len(s),17525)):
                  print(f"{i+1:6d}: {s[i]}")
          PY
