name: Compile actual lifted host as Windows PE32 (no original game data)
on:
  push:
    branches: [work/deadspace-windows-lifted-host-2026-11-04]
    paths:
      - source/experimental/lifted_milestone6/tools/**
      - source/experimental/windows_native_host/**
      - source/tests/check_windows_lifted_host.py
      - .github/workflows/windows-lifted-host-crosscheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mingw-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native Windows cross compiler (i686 POSIX pthread model)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686-posix binutils-mingw-w64-i686 file
      - name: Download official SDL2 MinGW x86 development SDK
        run: |
          curl -fL --retry 3 -o /tmp/SDL2-devel-mingw.tar.gz \
            https://www.libsdl.org/release/SDL2-devel-2.32.10-mingw.tar.gz
          tar -xzf /tmp/SDL2-devel-mingw.tar.gz -C /tmp
          test -f /tmp/SDL2-2.32.10/i686-w64-mingw32/include/SDL2/SDL.h
          test -f /tmp/SDL2-2.32.10/i686-w64-mingw32/bin/SDL2.dll
      - name: Cross-compile and link real SDL2/OpenGL lifted host as PE32
        run: python3 source/tests/check_windows_lifted_host.py --sdl-root /tmp/SDL2-2.32.10
