name: Xperia Windows ARM guest runtime and WPF wrapper
on:
  workflow_dispatch:
  push:
    branches:
      - work/deadspace-xperia-arm-wrapper-2026-11-02
    paths:
      - 'experimental/xperia_armjit/**'
      - 'experimental/xperia_guest_loader/**'
      - 'launcher/**'
      - 'tests/Test-Launcher.ps1'
      - 'tests/Test-Installer-Synthetic.ps1'
      - '.github/workflows/xperia-windows-arm-runtime.yml'
concurrency:
  group: xperia-windows-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-xperia-wrapper:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing Windows WPF launcher and installed-file importer
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/Test-Launcher.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WPF launcher tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-Installer-Synthetic.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer archive tests failed' }
      - name: Install pinned Boost header dependency for Dynarmic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'boost_1_86_0.zip'
          $dest=Join-Path $env:RUNNER_TEMP 'boost_1_86_0'
          Invoke-WebRequest -Uri 'https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          if(-not (Test-Path -LiteralPath (Join-Path $dest 'boost/version.hpp') -PathType Leaf)){
            throw 'Pinned Boost 1.86.0 header tree missing'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "XPERIA_BOOST_ROOT=$dest"
      - name: Configure Windows x64 Dynarmic guest runtime
        shell: pwsh
        run: cmake -S experimental/xperia_armjit -B build/armjit -A x64 -DBoost_INCLUDE_DIR="$env:XPERIA_BOOST_ROOT" -DBoost_NO_BOOST_CMAKE=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile ARM32 JIT, ELF loader, Bionic and guest callbacks
        shell: pwsh
        run: cmake --build build/armjit --config Release --parallel 4
      - name: Run translated ARM execution and Bionic regression suite
        shell: pwsh
        run: ctest --test-dir build/armjit -C Release --output-on-failure
      - name: Compile no-console Windows WPF launcher executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $source=Get-Content -LiteralPath launcher/LauncherStub.cs -Raw
          Add-Type -TypeDefinition $source -Language CSharp -ReferencedAssemblies 'System.Windows.Forms' -OutputAssembly 'dist/DeadSpaceLauncher.exe' -OutputType WindowsApplication
          if(-not (Test-Path 'dist/DeadSpaceLauncher.exe')){throw 'WPF launcher executable missing'}
      - name: Package one Windows wrapper with guest runtime binaries
        shell: pwsh
        run: |
          $root='dist/DeadSpaceMobile-Xperia-Windows'
          $launch=Join-Path $root 'launcher'
          New-Item -ItemType Directory -Force $launch | Out-Null
          Copy-Item 'dist/DeadSpaceLauncher.exe' $root
          Copy-Item 'launcher/Core.ps1','launcher/Installer.ps1','launcher/Launcher.ps1','launcher/Launcher.xaml','launcher/GuestPreflight.ps1' $launch
          Copy-Item 'build/armjit/Release/xperia_guest_import_report.exe','build/armjit/Release/xperia_guest_startup.exe' $launch
          $license=Join-Path $root 'licenses'
          New-Item -ItemType Directory -Force $license | Out-Null
          Copy-Item 'experimental/xperia_armjit/third_party/powervr/LICENSE.md' (Join-Path $license 'PowerVR-PVRTC-MIT.txt')
          @'
          Dead Space Mobile Xperia Play - Windows ARM wrapper (engineering build)

          1. Launch DeadSpaceLauncher.exe and install your own Xperia Play ZIP.
          2. Runtime -> Check installed ARM game imports uses the bundled native
             Windows ELF scanner. It produces guest-preflight.json in launcher logs.
          3. When your original Xperia assets are verified and this Windows
             runtime is present, the launcher enables TRY ORIGINAL ARM GAME.
             The bundled xperia_guest_startup.exe attempts JNI_OnLoad,
             original-game audio, NativeOnCreate, surface and game frames
             with SDL/OpenGL/PS4 controller support.
          4. THIS IS AN UNVERIFIED ENGINEERING BUILD. Original ARM code may
             stop at a missing service or show no rendered menu. Logs go to
             %%LOCALAPPDATA%%/DeadSpaceMobile-Xperia/launcher-logs.
             A successful synthetic JIT test is NOT proof of playable game.

          No WSL2, Docker, Linux packaging, Python or original EA game files are
          required for the launcher or included in this archive.
          '@ | Set-Content -Encoding utf8 (Join-Path $root 'README.txt')
          if(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.apk','.so','.ktx','.m3g','.sb','.jar') }){
            throw 'User-owned copyrighted Xperia game bytes leaked into the package'
          }
          Compress-Archive -Path "$root/*" -DestinationPath 'dist/DeadSpaceMobile-Xperia-Windows-Wrapper.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: deadspace-xperia-windows-arm-wrapper
          path: dist/DeadSpaceMobile-Xperia-Windows-Wrapper.zip
          retention-days: 20
          if-no-files-found: error
