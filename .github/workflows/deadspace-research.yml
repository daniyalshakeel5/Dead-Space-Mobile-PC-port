name: Dead Space Mobile - remote port research

on:
  push:
    branches:
      - work/deadspace-remote-preflight-2026-11-01
    paths:
      - "tools/deadspace_audit.py"
      - "tests/test_deadspace_audit.py"
      - "tools/deadspace_asset_recon.py"
      - "tests/test_deadspace_asset_recon.py"
      - "tools/deadspace_public_report.py"
      - "tests/test_deadspace_public_report.py"
      - "docs/private-apk-analysis.trigger"
      - ".github/workflows/deadspace-research.yml"
  pull_request:
    paths:
      - "tools/deadspace_audit.py"
      - "tests/test_deadspace_audit.py"
      - "tools/deadspace_asset_recon.py"
      - "tests/test_deadspace_asset_recon.py"
      - "tools/deadspace_public_report.py"
      - "tests/test_deadspace_public_report.py"
      - "docs/private-apk-analysis.trigger"
      - ".github/workflows/deadspace-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Research on GitHub runner (not local VM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fixture tests
        run: python -m unittest discover -s tests -v

      - name: Inventory repository on pull requests (no private APK)
        if: github.event_name == 'pull_request'
        run: |
          python tools/deadspace_audit.py --root . --output "$RUNNER_TEMP/private-audit.json"
          python -m tools.deadspace_public_report --audit "$RUNNER_TEMP/private-audit.json" --output report/deadspace-public-evidence.json

      - name: Private APK analysis if an authorized URL is configured (owner push or manual)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DS_APK_URL: ${{ secrets.DS_APK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/deadspace.apk" "$RUNNER_TEMP/private-audit.json" "$RUNNER_TEMP/private-resource-recon.json"' EXIT
          if [[ -n "${DS_APK_URL:-}" ]]; then
            # No APK bytes, archive member names or original ELF symbols reach artifacts.
            curl --fail --silent --show-error --location --retry 2 \
              --max-time 480 --max-filesize 1073741824 \
              --output "$RUNNER_TEMP/deadspace.apk" "$DS_APK_URL"
            python tools/deadspace_audit.py --root . \
              --apk "$RUNNER_TEMP/deadspace.apk" \
              --output "$RUNNER_TEMP/private-audit.json"
            python tools/deadspace_asset_recon.py \
              --apk "$RUNNER_TEMP/deadspace.apk" \
              --output "$RUNNER_TEMP/private-resource-recon.json"
            python -m tools.deadspace_public_report \
              --audit "$RUNNER_TEMP/private-audit.json" \
              --recon "$RUNNER_TEMP/private-resource-recon.json" \
              --output report/deadspace-public-evidence.json
          else
            echo "No DS_APK_URL: repository-only audit. Real APK was NOT analyzed."
            python tools/deadspace_audit.py --root . \
              --output "$RUNNER_TEMP/private-audit.json"
            python -m tools.deadspace_public_report \
              --audit "$RUNNER_TEMP/private-audit.json" \
              --output report/deadspace-public-evidence.json
          fi

      - name: Upload metadata report only
        uses: actions/upload-artifact@v4
        with:
          name: deadspace-port-audit
          path: report/deadspace-public-evidence.json
          if-no-files-found: error
          retention-days: 7
