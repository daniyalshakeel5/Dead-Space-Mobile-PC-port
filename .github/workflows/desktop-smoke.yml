name: Dead Space Mobile - Windows Linux desktop foundation

on:
  push:
    branches:
      - work/deadspace-remote-preflight-2026-11-01
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/input_tests.cpp"
      - ".github/workflows/desktop-smoke.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/input_tests.cpp"
      - ".github/workflows/desktop-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    name: Core + CTest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-free native core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDS_BUILD_INPUT_PROBE=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run deterministic input tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  sdl2-probe:
    name: Optional SDL2 input diagnostics / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install system SDL2 (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure (Windows fetches pinned SDL2 source)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDS_BUILD_INPUT_PROBE=ON -DDS_FETCH_SDL2=ON
      - name: Build native diagnostics AND the input tests
        run: cmake --build build --config Release --parallel 2
      - name: Run input unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure
