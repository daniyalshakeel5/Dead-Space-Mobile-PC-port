name: Windows startup regression check

on:
  push:
    branches: [work/windows-build-download-2026-11-10]
    paths:
      - .github/workflows/windows-startup-check.yml
      - source/scripts/check-windows-startup.ps1
      - downloads/DeadSpaceMobile-Windows-Startup-Fix.zip
      - downloads/DeadSpaceMobile-Windows-Native-Controller.zip
      - downloads/DeadSpaceMobile-Windows-Audio-Fix.zip
      - downloads/DeadSpaceMobile-Windows-Gesture-Fix.zip
      - downloads/diagnostics/windows-accel-check.exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run native Win32 sensor regression test
        shell: powershell
        run: |
          & ./downloads/diagnostics/windows-accel-check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows sensor regression test failed.' }
      - name: Download genuine upstream APK and test-only Mesa OpenGL
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $inputs = Join-Path $env:RUNNER_TEMP 'windows-startup-inputs'
          New-Item -ItemType Directory -Force $inputs | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/RAFALAMAO/Dead-Space-Mobile-Fixes/releases/download/dead_space_mobile_fixes/Deas.Space.Mobile.Fixes.apk' -OutFile (Join-Path $inputs 'original.apk')
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/GINESTR0/DeadSpaceReanimated/releases/download/v1.3/DeadSpaceReanimated-1.3.apk' -OutFile (Join-Path $inputs 'reanimated.apk')
          gh release download 26.2.6 --repo mmozeiko/build-mesa --pattern 'mesa-llvmpipe-x86-26.2.6.7z' --dir $inputs
          if ($LASTEXITCODE -ne 0) { throw 'Test-only Mesa download failed.' }
      - name: Verify Windows gesture build, audio, fullscreen and native controller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = Join-Path $env:RUNNER_TEMP 'windows-startup-inputs'
          & ./source/scripts/check-windows-startup.ps1 -PackageZip (Join-Path $env:GITHUB_WORKSPACE 'downloads/DeadSpaceMobile-Windows-Gesture-Fix.zip') -Apk (Join-Path $inputs 'original.apk') -ReanimatedApk (Join-Path $inputs 'reanimated.apk') -MesaArchive (Join-Path $inputs 'mesa-llvmpipe-x86-26.2.6.7z') -WorkRoot (Join-Path $env:RUNNER_TEMP 'windows-startup')
      - name: Check and convert genuine framebuffer captures
        shell: powershell
        run: |
          python -m pip install --quiet Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-startup/evidence'
          Get-ChildItem $evidence -Filter '*.ppm' | ForEach-Object {
            python -c "import sys; from pathlib import Path; from PIL import Image; p=Path(sys.argv[1]); s=p.with_name(p.stem+'-frame-size.txt'); expected=tuple(map(int,s.read_text(encoding='utf-8-sig').split())) if s.exists() else (1366,768); im=Image.open(p).convert('RGB'); assert im.size==expected, (im.size,expected); assert any(lo!=hi for lo,hi in im.getextrema()), 'Blank framebuffer'; im.save(p.with_suffix('.png')); print(im.size, im.getextrema())" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Framebuffer validation failed.' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-evidence
          path: ${{ runner.temp }}/windows-startup/evidence/
          if-no-files-found: warn
          retention-days: 7
