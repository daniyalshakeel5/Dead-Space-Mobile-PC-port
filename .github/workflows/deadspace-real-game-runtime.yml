name: "Dead Space: REAL APK native i686 runtime"

on:
  workflow_dispatch:
    inputs:
      private_asset_repo:
        description: "Private repository with authentic original game release assets"
        required: true
        default: "daniyalshakeel5/Dead-Space-Mobile-Assets"
        type: string
      release_tag:
        description: "Private release tag"
        required: true
        default: "native-game-inputs"
        type: string

permissions:
  contents: read

jobs:
  native-i686-real-game:
    name: "Build original ARM game, run 900 SDL frames"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deadspace-milestone6-analysis-2026-11-04
      - name: "Require original private game access"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DS_PRIVATE_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing DS_PRIVATE_ASSETS_TOKEN (Contents:Read permission on private game assets)"
            exit 1
          fi
          echo "Private original game source is configured."
      - name: "Download real APK and game data from private GitHub Release"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DS_PRIVATE_ASSETS_TOKEN }}
          PRIVATE_REPO: ${{ inputs.private_asset_repo }}
          PRIVATE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$PRIVATE_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Private repository must be owner/name"; exit 2
          fi
          mkdir -p "$RUNNER_TEMP/private-dspc"
          gh release download "$PRIVATE_TAG" -R "$PRIVATE_REPO" \
            --pattern '*.apk' --pattern 'deadspace.zip' \
            --dir "$RUNNER_TEMP/private-dspc"
          mapfile -t apks < <(find "$RUNNER_TEMP/private-dspc" -maxdepth 1 -type f -iname '*.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one real APK in the private release"; exit 3
          fi
          [[ -s "$RUNNER_TEMP/private-dspc/deadspace.zip" ]] || {
            echo "::error::Private original deadspace.zip is missing"; exit 4;
          }
          echo "DS_PRIVATE_GAME_APK=${apks[0]}" >> "$GITHUB_ENV"
          echo "DS_REAL_DATA_ZIP=$RUNNER_TEMP/private-dspc/deadspace.zip" >> "$GITHUB_ENV"
          echo "Private original game data is staged on ephemeral runner only."
      - name: "Install native Linux i686 GCC, SDL2, OpenGL and translator requirements"
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib g++-multilib libc6-dev-i386 \
            libsdl2-dev:i386 libgl1-mesa-dri:i386 \
            xvfb xauth unzip file python3-venv
          python3 -m venv "$RUNNER_TEMP/dspc-python"
          "$RUNNER_TEMP/dspc-python/bin/pip" install --disable-pip-version-check \
            pyelftools Pillow
          echo "$RUNNER_TEMP/dspc-python/bin" >> "$GITHUB_PATH"
      - name: "REAL GAME: compile original ARM, launch i686 SDL, interact and check 900 frames"
        shell: bash
        run: bash experimental/lifted_milestone6/Run-Real-Game-CI.sh
      - name: "Prevent copyrighted game file artifacts"
        if: always()
        shell: bash
        run: echo "No original APK, data, screenshots or game assets are uploaded to public artifacts."
