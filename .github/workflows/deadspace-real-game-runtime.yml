name: "Dead Space Mobile — REAL APK Linux native runtime"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deadspace-real-game-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-apk-i686-native:
    name: "Real game ELF → i686 translation → SDL/OpenGL game frames"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout real port source
        uses: actions/checkout@v4
        with:
          ref: work/deadspace-milestone6-analysis-2026-11-04
      - name: Download the ACTUAL Dead Space Mobile APK from the owner's existing GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actual-original-game"
          gh release download apk-files-for-testing \
            -R daniyalshakeel5/Dead-Space-Mobile-PC-port \
            --pattern 'Deas.Space.Mobile.Fixes.apk' \
            --dir "$RUNNER_TEMP/actual-original-game"
          apk="$RUNNER_TEMP/actual-original-game/Deas.Space.Mobile.Fixes.apk"
          [[ -s "$apk" ]] || {
            echo "::error::Actual game APK is missing from GitHub Release apk-files-for-testing"
            exit 10
          }
          echo "Real game APK size: $(stat -c %s "$apk") bytes"
          echo "Real game archive SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)"
          unzip -l "$apk" 'lib/armeabi/libDeadSpace.so' 'assets/EAMCore.ini' 'assets/published/*' | head -n 35
          echo "DS_PRIVATE_GAME_APK=$apk" >> "$GITHUB_ENV"
          # No fake resource archive is invented. The original APK's published
          # assets are used directly. An additional external archive can be
          # included in a future real run only when actually available.
      - name: Install Linux i686 compiler and SDL/OpenGL software rendering
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib libc6-dev-i386 \
            libsdl2-dev:i386 libgl1-mesa-dri:i386 \
            xvfb xauth unzip file python3-venv
          python3 -m venv "$RUNNER_TEMP/dspc-python"
          "$RUNNER_TEMP/dspc-python/bin/pip" install --disable-pip-version-check pyelftools Pillow
          echo "$RUNNER_TEMP/dspc-python/bin" >> "$GITHUB_PATH"
      - name: "900-frame real APK boot: native model source recovery and final-frame rendering"
        shell: bash
        env:
          DS_REAL_TEST_FRAMES: "900"
        run: bash experimental/lifted_milestone6/Run-Real-Game-CI.sh
      - name: Save actual 900-frame native render and crash evidence
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/dspc-live/logs"
          if [[ -s "$root/native-run.log" ]]; then
            tail -n 5000 "$root/native-run.log" > "$root/native-run-tail.log"
          fi
          if [[ -s "$root/native-build.log" ]]; then
            tail -n 300 "$root/native-build.log" > "$root/native-build-tail.log"
          fi
      - name: Upload actual native framebuffer and compact game runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-space-mobile-real-apk-native-900-frame-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/dspc-live/logs/native-frame.png
            ${{ runner.temp }}/dspc-live/logs/native-run-tail.log
            ${{ runner.temp }}/dspc-live/logs/native-build-tail.log
      - name: Report authentic runtime result
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/dspc-live"
          if [[ -f "$root/logs/native-build.log" ]]; then
            echo "Native translated compile log: $(wc -l < "$root/logs/native-build.log") lines"
          fi
          if [[ -f "$root/logs/native-run.log" ]]; then
            echo "==== Actual game runtime log, last 160 lines ===="
            tail -n 160 "$root/logs/native-run.log"
          fi
          echo "The original copyrighted APK and extracted assets remain only on the transient runner."
