name: Xperia ATC texture decode tests
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - experimental/xperia_atc/**
      - .github/workflows/xperia-atc-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S experimental/xperia_atc -B build-atc
      - run: cmake --build build-atc --config Release
      - run: ctest --test-dir build-atc -C Release --output-on-failure
