name: Xperia Play ELF32 ARM preflight
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - "tools/xperia_play_elf_preflight.py"
      - "tests/test_xperia_play_elf_preflight.py"
      - ".github/workflows/xperia-arm-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_xperia_play_elf_preflight.py -v
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_xperia_play_elf_preflight.py -v
