name: Xperia Reanimated HD APK installer tests
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - tools/xperia_reanimated_hd_install.py
      - tests/test_xperia_reanimated_hd_install.py
      - tools/xperia_vita_donor_install.py
      - tests/test_xperia_vita_donor_install.py
      - .github/workflows/xperia-reanimated-hd-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic HD APK extraction and isolation tests
        run: python -m unittest discover -s tests -p test_xperia_reanimated_hd_install.py -v
