name: Windows native engine - executable and tests
on:
  push:
    branches:
      - work/deadspace-xperia-arm-wrapper-2026-11-02
    paths:
      - 'CMakeLists.txt'
      - 'apps/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/windows-native-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure real Windows x64 native executable
        shell: pwsh
        run: |
          cmake -S . -B build/windows -A x64 -DDS_FETCH_SDL2=ON -DDS_BUILD_BOOT_SPLASH=ON -DDS_BUILD_ASSET_INSTALLER=OFF -DDS_ENABLE_TESTS=ON
      - name: Compile full native engine and tests
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel 4
      - name: Test native subsystems
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Smoke-test compiled Windows executable
        shell: pwsh
        run: |
          $exe='build/windows/Release/deadspace_native.exe'
          if (!(Test-Path $exe)) { throw 'Native executable is missing' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Native --help failed' }
          & $exe --status
          # --status is allowed to report engine incomplete.
          Write-Host "Native Windows executable available: $exe"
      - name: Package asset-free Windows test build
        shell: pwsh
        run: |
          $dest='dist/DeadSpaceMobile-Native-Windows-x64'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item 'build/windows/Release/deadspace_native.exe' $dest
          $dlls=Get-ChildItem 'build/windows' -Filter SDL2.dll -Recurse -File
          if ($dlls) { Copy-Item $dlls[0].FullName $dest }
          if (Get-ChildItem $dest -Recurse -File | Where-Object { $_.Extension -in @('.apk','.m3g','.ktx','.sb','.jar') }) {
            throw 'Original copyrighted game content cannot be shipped'
          }
          @'
          Dead Space Mobile native PC rebuild — WINDOWS TEST BUILD

          Run deadspace_native.exe --help
          Native menu test: deadspace_native.exe --boot-splash --assets-dir "PATH_TO_EXTRACTED_ORIGINAL_FILES"

          No original game files are included. The native gameplay engine is incomplete.
          This executable is for subsystem verification, not a playable game release.
          '@ | Set-Content -Encoding UTF8 "$dest/README.txt"
          Compress-Archive -Path "$dest/*" -DestinationPath 'dist/DeadSpaceMobile-Native-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: deadspace-native-windows-x64-test-build
          path: dist/DeadSpaceMobile-Native-Windows-x64.zip
          retention-days: 14
          if-no-files-found: error
