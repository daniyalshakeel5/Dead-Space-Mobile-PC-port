name: Verify Reanimated v1.3 native Linux game donor extraction
on:
  push:
    branches: [work/deadspace-linux-touchscreen-2026-11-07]
    paths: [.github/workflows/deadspace-reanimated-donor-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-reanimated-donor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve actual GINESTR0 v1.3 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reanimated" "$RUNNER_TEMP/game"
          gh release download v1.3 -R GINESTR0/DeadSpaceReanimated \
            -p 'DeadSpaceReanimated-1.3.apk' -D "$RUNNER_TEMP/reanimated"
          bash -n packaging/linux-touchscreen/Play-Dead-Space-Touch.sh
      - name: Exercise real nested game extraction path without copying copyrighted files to artifacts
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/reanimated/DeadSpaceReanimated-1.3.apk"
          GAME="$RUNNER_TEMP/game"
          unzip -Z1 "$APK" | grep -Fx 'assets/game/libDeadSpace32.so' >/dev/null
          stage="$(mktemp -d "$GAME/.reanimated.XXXXXXXX")"
          unzip -qn "$APK" 'assets/game/assets/*' -d "$stage"
          mkdir -p "$GAME/assets" "$GAME/lib/armeabi"
          cp -an "$stage/assets/game/assets/." "$GAME/assets/"
          unzip -p "$APK" 'assets/game/libDeadSpace32.so' > "$GAME/lib/armeabi/libDeadSpace.so"
          rm -rf "$stage"
          sha1="$(sha1sum "$GAME/lib/armeabi/libDeadSpace.so" | awk '{print $1}')"
          echo "VERIFIED_REANIMATED_LIBRARY_SHA1 $sha1"
          [[ "$sha1" == 64a3323cd3cc0c483a645b62af8508624163ba9b ]]
          count="$(find "$GAME/assets/published" -type f | wc -l)"
          echo "VERIFIED_REANIMATED_PUBLISHED_COUNT $count"
          [[ "$count" == 1729 ]]
          test -s "$GAME/assets/published/models/isaac.m3g"
          test -s "$GAME/assets/published/texturepacks_ui/ui_frontend.m3g"
          echo "PASS Reanimated v1.3 donor extraction compatible with native i686 game binary."
          echo "No copyrighted assets are exported from this run."
