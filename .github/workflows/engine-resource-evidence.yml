name: Original APK resource-factory evidence
on:
  pull_request:
    paths:
      - ".github/workflows/engine-resource-evidence.yml"
      - "tools/deadspace_original_code_window.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-resource-factory:
    if: github.repository == 'daniyalshakeel5/Dead-Space-Mobile-PC-port' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/deadspace-remote-preflight-2026-11-01'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ELF decoder on remote runner only
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Recover original resource-factory instructions
        shell: bash
        run: |
          set -euo pipefail
          # User confirmed public upstream APK is identical to their owned APK.
          curl --fail --silent --show-error --location --retry 3 --max-time 720 \
            --max-filesize 400000000 \
            --output "$RUNNER_TEMP/deadspace.apk" \
            https://github.com/RAFALAMAO/Dead-Space-Mobile-Fixes/releases/download/dead_space_mobile_fixes/Deas.Space.Mobile.Fixes.apk
          test "$(wc -c < "$RUNNER_TEMP/deadspace.apk" | tr -d ' ')" = 325769461
          python tools/deadspace_original_code_window.py \
            --apk "$RUNNER_TEMP/deadspace.apk" \
            --output "$RUNNER_TEMP/full-instruction-windows.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          raw=json.loads((Path(os.environ["RUNNER_TEMP"])/"full-instruction-windows.json").read_text())
          names=("post_setup_direct_callee_0x2803e4",
                 "resource_lookup_0x28b3a4",
                 "resource_factory_mode1_0x28a718",
                 "resource_factory_parse_0x28aab4",
                 "resource_factory_copy_0x28b1e8",
                 "resource_factory_string_0x1a76d0",
                 "resource_lookup_0x28a5f4",
                 "resource_lookup_0x28a4f8",
                 "resource_lookup_0x283cb4",
                 "resource_lookup_0x286918",
                 "resource_parser_0x2863ec",
                 "resource_loader_tree_begin_0x283408",
                 "resource_loader_tree_next_0x2933ec",
                 "resource_lookup_0x284d38",
                 "resource_lookup_0x284df8",
                 "resource_lookup_0x28a644",
                 "resource_cleanup_0x284f00")
          windows={}
          for name in names:
              item=raw["windows"][name]
              windows[name]={"address":item["address"],
                             "instructions":item["instructions"],
                             "complete_arm_decode":item["complete_arm_decode"]}
              print("RESOURCE_FUNC",name,json.dumps(windows[name],separators=(",",":")))
          # Exact original factory vtable: LDR LR,[PC,#0x10c] at
          # 0x28B3A8, ADD LR,PC,LR at 0x28B3B4, ADD LR,LR,#8.
          import struct
          from zipfile import ZipFile
          from tools.deadspace_original_code_window import (
              elf32_executable_sections,bounded_virtual_read)
          with ZipFile(Path(os.environ["RUNNER_TEMP"])/"deadspace.apk") as apk:
              libs=[i for i in apk.infolist() if i.filename.startswith("lib/")
                    and i.filename.endswith(".so") and 1024<i.file_size<=64*1024*1024]
              if len(libs)!=1:
                  raise ValueError("Expected exactly one original ARM ELF")
              elf=apk.read(libs[0])
          displacement=struct.unpack("<i",bounded_virtual_read(
              elf,elf32_executable_sections(elf),0x28b4bc,4))[0]
          vtable=(0x28b3b4+8+displacement+8)&0xffffffff
          print("ORIGINAL_FACTORY_VTABLE",hex(vtable))
          # Original 0x28A4F8 cleanup vtable via 0x28A4FC LDR,
          # 0x28A508 ADD PC and 0x28A50C ADD #8.
          cleanup_displacement=struct.unpack("<i",bounded_virtual_read(
              elf,elf32_executable_sections(elf),0x28a53c,4))[0]
          cleanup_vtable=(0x28a508+8+cleanup_displacement+8)&0xffffffff
          print("ORIGINAL_UNREADY_CLEANUP_VTABLE",hex(cleanup_vtable))
          outfile=Path(os.environ["RUNNER_TEMP"])/"resource-instructions.json"
          outfile.write_text(json.dumps({"schema":2,
               "factory_mode1_vtable_arm_va":hex(vtable),
               "unready_cleanup_vtable_arm_va":hex(cleanup_vtable),
               "windows":windows},indent=2)+"\n")
          PY
      - name: Publish ARM instruction metadata only
        uses: actions/upload-artifact@v4
        with:
          name: deadspace-resource-instruction-metadata
          path: ${{ runner.temp }}/resource-instructions.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary copyrighted APK
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deadspace.apk" "$RUNNER_TEMP/full-instruction-windows.json"
