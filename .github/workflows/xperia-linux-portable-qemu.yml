name: Portable Linux QEMU Xperia Play runtime (no user Docker)
on:
  push:
    branches: [work/deadspace-xperia-arm-wrapper-2026-11-02]
    paths:
      - "linux-portable/**"
      - ".github/workflows/xperia-linux-portable-qemu.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate original-free Linux launch sources
        shell: bash
        run: |
          bash -n "linux-portable/Run Dead Space.sh"
          ! grep -E 'docker|wsl.exe' "linux-portable/Run Dead Space.sh"
      - name: Retrieve original-free GPL ARM loader from upstream public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          curl -fL --retry 4 --retry-delay 3 --max-time 240 -o "$RUNNER_TEMP/portmaster.zip" \
            https://github.com/EapRules/deadspace-native-arm/releases/download/v1.2.8/deadspace-portmaster.zip
          unzip -q "$RUNNER_TEMP/portmaster.zip" -d "$RUNNER_TEMP/upstream"
          echo "Public original-free port distribution:"
          find "$RUNNER_TEMP/upstream" -maxdepth 5 -type f | head -60
          while IFS= read -r -d '' item; do
            if file "$item" | grep -Eq 'ELF 32-bit.*ARM'; then
              if [[ "$(basename "$item")" == "deadspace" ]]; then
                cp "$item" "$RUNNER_TEMP/deadspace-armhf"
                echo "ARM_LOADER=$item"
              fi
            fi
          done < <(find "$RUNNER_TEMP/upstream" -type f -print0)
          test -s "$RUNNER_TEMP/deadspace-armhf" || {
            echo "ARM game loader not found in upstream release — don't publish an empty runtime."
            exit 2
          }
      - name: Obtain bundled x86 QEMU, unzip and ARMHF Linux desktop libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture armhf
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse' |
            sudo tee /etc/apt/sources.list.d/armhf.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-user-static busybox-static \
            libc6:armhf libgcc-s1:armhf libstdc++6:armhf \
            zlib1g:armhf libzip4t64:armhf libbsd0:armhf \
            libsdl2-2.0-0:armhf libegl1:armhf libgles1:armhf \
            libgl1:armhf libglx0:armhf libglx-mesa0:armhf libglvnd0:armhf \
            libgl1-mesa-dri:armhf libgbm1:armhf libglapi-mesa:armhf \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross xvfb xauth
      - name: Package and execute real upstream ARM loader --version via bundled QEMU
        shell: bash
        run: |
          set -euxo pipefail
          dest="$RUNNER_TEMP/DeadSpaceMobile-Xperia-Linux"
          mkdir -p "$dest/bin" "$dest/sysroot/lib" "$dest/sysroot/usr/lib" "$dest/licenses/armhf"
          cp /usr/bin/qemu-arm-static "$dest/bin/qemu-arm-static"
          cp /bin/busybox "$dest/bin/busybox"
          cp "$RUNNER_TEMP/deadspace-armhf" "$dest/bin/deadspace-armhf"
          sudo cp -a /lib/arm-linux-gnueabihf "$dest/sysroot/lib/"
          sudo cp -a /usr/lib/arm-linux-gnueabihf "$dest/sysroot/usr/lib/"
          sudo cp -a /lib/ld-linux-armhf.so.3 "$dest/sysroot/lib/"
          # The upstream glibc 2.31 binary still needs legacy SONAMEs such as
          # libcrypto.so.1.1, which Ubuntu 24.04 no longer ships.
          # Merge only MISSING libraries from upstream's own public, licensed
          # PortMaster runtime; do not replace newer ARMHF Mesa/SDL libraries.
          for oldlib in "$RUNNER_TEMP"/upstream/deadspace/libs.armhf/*.so*; do
            base="$(basename "$oldlib")"
            test -e "$dest/sysroot/usr/lib/arm-linux-gnueabihf/$base" ||
              sudo cp -L "$oldlib" "$dest/sysroot/usr/lib/arm-linux-gnueabihf/$base"
          done
          cp -a "$RUNNER_TEMP/upstream/deadspace/licenses" "$dest/licenses/upstream-portmaster"
          cp 'linux-portable/Run Dead Space.sh' "$dest/Run Dead Space.sh"
          cp 'linux-portable/Dead Space Mobile.desktop' "$dest/Dead Space Mobile.desktop"
          cp 'linux-portable/README.md' "$dest/README.md"
          for pkg in $(dpkg-query -W | awk '{print $1}' | grep ':armhf$'); do
            base="$(echo "$pkg" | cut -d: -f1)"
            notice="/usr/share/doc/$base/copyright"
            test ! -f "$notice" || cp "$notice" "$dest/licenses/armhf/$base.copyright"
          done
          cp /usr/share/doc/qemu-user-static/copyright "$dest/licenses/QEMU.copyright"
          cp /usr/share/doc/busybox-static/copyright "$dest/licenses/BusyBox.copyright"
          curl -fL --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/EapRules/deadspace-native-arm/main/LICENSE \
            -o "$dest/licenses/EapRules-GPL-3.0.txt"
          chmod +x "$dest/bin/"* "$dest/Run Dead Space.sh" "$dest/Dead Space Mobile.desktop"
          echo "QEMU host binary:"
          "$dest/bin/qemu-arm-static" --version | head -1
          # User field logs 2026-11-03 show SDL_CreateWindow failed:
          # missing ARMHF libGL.so.1, followed by 182 unresolved GL imports.
          # Verify the GL/GLX loader and the ACTUAL ARMHF SDL window path,
          # not just game loader --version, before uploading any artifact.
          test -s "$dest/sysroot/usr/lib/arm-linux-gnueabihf/libGL.so.1"
          test -s "$dest/sysroot/usr/lib/arm-linux-gnueabihf/libGLX.so.0"
          test -s "$dest/sysroot/usr/lib/arm-linux-gnueabihf/libGLX_mesa.so.0"
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -o "$RUNNER_TEMP/graphics-probe-armhf" \
            linux-portable/graphics_probe_arm.c -ldl
          echo "ARMHF SDL2 + libGL + GLES1 / GL2.1 compatibility under real QEMU:"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            "$dest/bin/qemu-arm-static" -L "$dest/sysroot" "$RUNNER_TEMP/graphics-probe-armhf"
          echo "Actual upstream GNU/Linux ARM32 Dead Space loader executed through QEMU:"
          "$dest/bin/qemu-arm-static" -L "$dest/sysroot" "$dest/bin/deadspace-armhf" --version
          test ! -e "$dest/game-data"
          du -sh "$dest"
          cd "$RUNNER_TEMP"
          zip -q -r "$GITHUB_WORKSPACE/DeadSpaceMobile-Xperia-Linux-x86_64-QEMU.zip" DeadSpaceMobile-Xperia-Linux
      - name: Package small graphics repair for users of the original Linux download
        shell: bash
        run: |
          set -Eeuo pipefail
          original="$RUNNER_TEMP/DeadSpaceMobile-Xperia-Linux"
          fix="$RUNNER_TEMP/DeadSpaceMobile-Xperia-Graphics-Fix"
          mkdir -p "$fix/graphics-patch/lib" "$fix/graphics-patch/bin"
          for name in libGL.so.1 libGLX.so.0 libGLX_mesa.so.0 libGLdispatch.so.0; do
            src="$original/sysroot/usr/lib/arm-linux-gnueabihf/$name"
            test -s "$src"
            cp -L "$src" "$fix/graphics-patch/lib/$name"
          done
          cp "$RUNNER_TEMP/graphics-probe-armhf" "$fix/graphics-patch/bin/graphics-probe-armhf"
          cp linux-portable/Apply-Graphics-Fix.sh "$fix/Apply-Graphics-Fix.sh"
          chmod +x "$fix/Apply-Graphics-Fix.sh" "$fix/graphics-patch/bin/graphics-probe-armhf"
          bash -n "$fix/Apply-Graphics-Fix.sh"
          ! find "$fix" -type f | grep -E 'libEAMGameDeadSpace|deadspace[.]zip|Reanimated.*apk'
          (cd "$fix" && zip -qr "$GITHUB_WORKSPACE/DeadSpaceMobile-Xperia-Graphics-Fix-2026-11-03.zip" .)
          unzip -tqq "$GITHUB_WORKSPACE/DeadSpaceMobile-Xperia-Graphics-Fix-2026-11-03.zip"
          ls -lh "$GITHUB_WORKSPACE/DeadSpaceMobile-Xperia-Graphics-Fix-2026-11-03.zip"
      - name: Publish small no-reinstall graphics fix on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="xperia-linux-armhf-opengl-fix-2026-11-03"
          archive="DeadSpaceMobile-Xperia-Graphics-Fix-2026-11-03.zip"
          cat > "$RUNNER_TEMP/hotfix-notes.md" <<'NOTES'
          ## Dead Space Mobile Linux QEMU — small OpenGL startup fix

          Fixes the original portable QEMU release, whose missing 32-bit ARMHF
          libGL.so.1 stops SDL_CreateWindow before the game can initialize.
          The fix includes ARMHF libGL, GLX, Mesa GLX dispatch and a runnable
          original-free ARM graphics probe.

          Download only this small ZIP. Extract its contents into your
          existing DeadSpaceMobile-Xperia-Linux folder, next to
          Run Dead Space.sh (NOT into a new separate folder).
          Right-click Apply-Graphics-Fix.sh and choose Run as Program.
          It installs the missing 32-bit guest graphics libraries locally
          and tests the SDL/OpenGL window. Then run the usual game launcher.

          No need to download the original 289 MB package again.
          No original game assets included. Linux x86-64 only.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --title "Dead Space Mobile Linux QEMU — ARMHF OpenGL graphics fix" \
              --notes-file "$RUNNER_TEMP/hotfix-notes.md" \
              --target "$GITHUB_SHA" --prerelease
          fi
      - name: Publish original-free Linux player test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DeadSpaceMobile-Xperia-Linux-x86_64-QEMU
          path: DeadSpaceMobile-Xperia-Linux-x86_64-QEMU.zip
          if-no-files-found: error
          retention-days: 30
