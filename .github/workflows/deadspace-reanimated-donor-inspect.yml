name: Inspect Dead Space Reanimated donor compatibility
on:
  push:
    branches: [work/deadspace-linux-touchscreen-2026-11-07]
    paths: [.github/workflows/deadspace-reanimated-donor-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor-inventory:
    name: Inspect genuine Reanimated v1.3 APK (metadata only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download GINESTR0's authentic v1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reanimated"
          gh release download v1.3 -R GINESTR0/DeadSpaceReanimated \
            -p 'DeadSpaceReanimated-1.3.apk' -D "$RUNNER_TEMP/reanimated"
          test -s "$RUNNER_TEMP/reanimated/DeadSpaceReanimated-1.3.apk"
          sha256sum "$RUNNER_TEMP/reanimated/DeadSpaceReanimated-1.3.apk"
          stat -c 'REANIMATED_APK_BYTES %s' "$RUNNER_TEMP/reanimated/DeadSpaceReanimated-1.3.apk"
      - name: Inventory game library, container format and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/reanimated/DeadSpaceReanimated-1.3.apk" <<'PY'
          import sys, zipfile, hashlib, json, collections
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise RuntimeError("Invalid APK member: "+bad)
              files=[x for x in z.infolist() if not x.is_dir()]
              print("APK_ENTRY_COUNT",len(files))
              extensions=collections.Counter(x.filename.rsplit('.',1)[-1].lower() for x in files if '.' in x.filename)
              print("EXTENSION_COUNTS",json.dumps(extensions.most_common(30)))
              print("TOP_80_LARGEST",json.dumps([{"path":x.filename,"uncompressed":x.file_size,"compressed":x.compress_size} for x in sorted(files,key=lambda a:-a.file_size)[:80]]))
              targets=[x for x in files if x.filename.endswith((".so",".apk",".zip",".obb",".pak",".dat",".bin",".dex")) or "game" in x.filename.lower() or "deadspace" in x.filename.lower()]
              print("GAME_LIBRARY_OR_PACKAGE_CANDIDATES",json.dumps([{"path":x.filename,"uncompressed":x.file_size} for x in sorted(targets,key=lambda a:-a.file_size)[:120]]))
              for x in sorted(targets,key=lambda a:-a.file_size)[:80]:
                  with z.open(x) as f:
                      magic=f.read(24)
                  if x.filename.endswith(".so") or x.file_size>1000000:
                      print("DONOR_MEMBER",json.dumps({"path":x.filename,"size":x.file_size,"first_24_hex":magic.hex()}))
                  if x.filename.endswith(".so") and x.file_size < 150000000:
                      sha=hashlib.sha1()
                      with z.open(x) as f:
                          for block in iter(lambda:f.read(1024*1024),b''):
                              sha.update(block)
                      print("ELF_LIBRARY_SHA1",x.filename,sha.hexdigest())
              print("SOURCE_ENGINE_EXPECTED_SHA1 64a3323cd3cc0c483a645b62af8508624163ba9b")
              print("INSPECTION_ONLY_NO_ASSETS_EXPORTED")
          PY
