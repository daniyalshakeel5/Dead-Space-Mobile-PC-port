name: Real APK milestone 6 baseline comparison
on:
  push:
    branches: [work/deadspace-real-baseline-2026-11-05]
    paths: [.github/workflows/deadspace-real-baseline.yml, experimental/lifted_milestone6/tools/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [current]
        mode: [original-reader]
    steps:
      - uses: actions/checkout@v4
      - name: Install native i686 dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2 install -y --no-install-recommends gcc-multilib libc6-dev-i386 libsdl2-2.0-0:i386 libgl1-mesa-dri:i386 libgl1:i386 xvfb xauth libarchive-tools gdb
          # Extract target headers without installing unrelated i386 GUI
          # development tools that conflict with the runner's host packages.
          mkdir -p "$RUNNER_TEMP/sdl-dev"
          cd "$RUNNER_TEMP/sdl-dev"
          apt-get download libsdl2-dev:i386
          dpkg-deb -x ./*.deb "$RUNNER_TEMP/sdl-prefix"
          echo "SDL_PREFIX=$RUNNER_TEMP/sdl-prefix" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install pyelftools Pillow
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Prepare genuine APK and selected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/baseline"
          mkdir -p "$root/download" "$root/apk" "$root/logs" "$root/shots"
          gh release download apk-files-for-testing -R "$GITHUB_REPOSITORY" --pattern 'Deas.Space.Mobile.Fixes.apk' --dir "$root/download"
          unzip -q "$root/download/Deas.Space.Mobile.Fixes.apk" -d "$root/apk"
          sha1sum "$root/apk/lib/armeabi/libDeadSpace.so" | tee "$root/logs/identity.txt"
          [[ "$(sha1sum "$root/apk/lib/armeabi/libDeadSpace.so" | cut -d' ' -f1)" == 64a3323cd3cc0c483a645b62af8508624163ba9b ]]
          if [[ "$SOURCE" == milestone6 ]]; then
            mkdir -p "$root/reference"
            bsdtar -xf dspc_milestone6.rar -C "$root/reference"
            mapfile -t entries < <(find "$root/reference" -name gen_all.py -type f)
            [[ "${#entries[@]}" == 1 ]]
            cp -a "$(dirname "${entries[0]}")" "$root/tools"
          else
            cp -a experimental/lifted_milestone6/tools "$root/tools"
          fi
          # Both variants use the exact asset/data arrangement reported by
          # the other agent. Each matrix job has its own writable directory.
          mkdir -p "$root/apk/assets/var"
          echo "DS_ROOT=$root" >> "$GITHUB_ENV"
      - name: Translate and compile original game functions
        run: |
          set -euo pipefail
          cd "$DS_ROOT/tools"
          export DS_TEXTUREPACK_DIAG=0
          export DS_SO="$DS_ROOT/apk/lib/armeabi/libDeadSpace.so"
          python3 gen_all.py > "$DS_ROOT/logs/generation.log" 2>&1
          python3 m3g_loader_serialization.py --source out/fn_055.c --instrument
          python3 - <<'PY'
          from pathlib import Path
          from native_buffered_input import patch
          from lift import Image, FuncLifter
          import os
          img = Image(os.environ["DS_SO"])
          fn = FuncLifter(img, 0x347d68)
          fn.lift()
          with open(os.environ["DS_ROOT"] + "/logs/buffered-source.log", "w") as log:
              for addr, lines in sorted(fn.out.items()):
                  log.write(f"{addr:08x} {img.w(addr):08x}: " + " ".join(lines) + "\n")
              for address, (size, name) in sorted(img.funcs.items()):
                  if "InputStream" in name:
                      log.write(f"STREAM_SYMBOL {address:08x} size={size} {name}\n")
              for address in (0x326948, 0x32ad98):
                  decoded = FuncLifter(img, address)
                  decoded.lift()
                  for addr, lines in sorted(decoded.out.items()):
                      log.write(f"{addr:08x} {img.w(addr):08x}: " + " ".join(lines) + "\n")
          matches = [p for p in Path("out").glob("fn_*.c") if "u64 f_00347d68(" in p.read_text()]
          assert len(matches) == 1
          p = matches[0]
          p.write_text(patch(p.read_text()))
          PY
          cd out
          DS_BUILD_JOBS=3 SDL_CFLAGS="-I$SDL_PREFIX/usr/include/SDL2 -I$SDL_PREFIX/usr/include/i386-linux-gnu" SDL_LIBS="/usr/lib/i386-linux-gnu/libSDL2-2.0.so.0" bash build.sh > "$DS_ROOT/logs/build.log" 2>&1
          file dspc_sdl | tee "$DS_ROOT/logs/executable.txt"
      - name: Run real first boot through difficulty and intro
        env:
          SOURCE: ${{ matrix.source }}
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          set -uo pipefail
          cd "$DS_ROOT/tools/out"
          # A/B the original reader against the recovered buffered reader.
          # Both use the genuine assets and original model decoder.
          export DS_ASSET_TRACE=1
          export DS_M3G_SERIALIZE=1
          if [[ "$MODE" == native-reader ]]; then export DS_NATIVE_BUFFERED_IO=1; fi
          affinity=()
          if [[ "$SOURCE" == milestone6 ]]; then
            cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
            affinity=(taskset -c "$cpu")
          fi
          timeout --kill-after=20s 900s "${affinity[@]}" xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe SDL_AUDIODRIVER=dummy \
            DS_WINDOW=1 DS_NOVSYNC=1 DS_QUIET_JAVA=1 DS_WATCHDOG=45 \
            DS_DATA="$DS_ROOT/apk/assets" DS_ASSETS="$DS_ROOT/apk/assets" \
            DS_STEPS=create,surface,frame DS_FRAMES=7200 \
            DS_CLICKS="600:640:675,1500:1145:668,2400:1145:668" \
            DS_SHOT_EVERY=120 DS_SHOT_DIR="$DS_ROOT/shots" \
            DS_SHOT="7190:$DS_ROOT/shots/final.ppm" \
            gdb -q -batch -ex 'set pagination off' -ex 'set print elements 24' \
            -ex run -ex 'thread apply all bt 6' -ex 'frame 0' -ex 'info locals' \
            -ex 'list' -ex 'info registers' -ex 'p/x sp' -ex 'x/80wx sp' \
            -ex 'p/x g_base' -ex 'x/20wx r4' -ex 'x/20wx *(unsigned int*)r4' \
            -ex 'x/20wx r6' \
            -ex 'frame 1' -ex 'info locals' -ex 'list' \
            --args ./dspc_sdl "$DS_ROOT/apk/lib/armeabi/libDeadSpace.so" > "$DS_ROOT/logs/runtime.log" 2>&1
          code=$?
          echo "$code" > "$DS_ROOT/logs/exit-code.txt"
          tail -n 100 "$DS_ROOT/logs/runtime.log"
          [[ $code == 0 ]] && grep -q '^ran frames' "$DS_ROOT/logs/runtime.log"
      - name: Preserve visual and crash evidence
        if: always()
        run: |
          root="$RUNNER_TEMP/baseline"
          mkdir -p "$root/evidence"
          for name in runtime build generation buffered-source; do
            if [[ -f "$root/logs/$name.log" ]]; then tail -n 1000 "$root/logs/$name.log" > "$root/evidence/$name-tail.log"; fi
          done
          cp "$root/logs/identity.txt" "$root/logs/executable.txt" "$root/logs/exit-code.txt" "$root/evidence/" 2>/dev/null || true
          if [[ -f "$root/logs/runtime.log" && -f "$root/tools/out/dspc_sdl" ]]; then
            grep -m1 'backtrace (use nm' "$root/logs/runtime.log" | grep -oE '0x[0-9a-fA-F]+' |
              xargs -r addr2line -a -f -C -e "$root/tools/out/dspc_sdl" > "$root/evidence/backtrace.txt" || true
          fi
          cat "$root/evidence/runtime-tail.log" "$root/evidence/backtrace.txt" 2>/dev/null || true
          python3 - "$root" <<'PY'
          import pathlib, sys
          if not list((pathlib.Path(sys.argv[1]) / "shots").glob("*.ppm")):
              sys.exit(0)
          from PIL import Image
          root = pathlib.Path(sys.argv[1])
          for path in (root / "shots").glob("*.ppm"):
              with Image.open(path) as image:
                  image.save(root / "evidence" / (path.stem + ".png"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-apk-baseline-${{ matrix.source }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/baseline/evidence
          retention-days: 7
