name: Inspect Dead Space Mobile milestone 6 (source only)
on:
  push:
    branches:
      - work/deadspace-milestone6-analysis-2026-11-04
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare-milestones:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install non-executing RAR archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar p7zip-full
      - name: Verify comparison tool on synthetic fixtures
        run: python3 tools/analyze_milestones.py --self-test
      - name: Compare milestone 5 ZIP and milestone 6 RAR
        run: |
          python3 tools/analyze_milestones.py \
            --old dspc_milestone5.zip \
            --new dspc_milestone6.rar \
            --report milestone6-analysis.md \
            --details
      - name: Import allowlisted milestone6 host sources to isolated development branch
        run: |
          python3 tools/import_milestone6_source.py dspc_milestone6.rar
          git add experimental/lifted_milestone6
          if git diff --cached --quiet; then
            echo "Milestone 6 source files already imported."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Import milestone6 portable native host sources without game assets"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - name: Attach source comparison report (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: deadspace-milestone6-metadata-report
          path: milestone6-analysis.md
          if-no-files-found: error
